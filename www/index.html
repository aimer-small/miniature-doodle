<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- CSP removed to prevent connection issues in preview environment -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>书剑 v3.0</title>
<style>
:root {
  --bg: #0d0d12; --panel: #1a1a2e; --border: #2a2a3e;
  --gold: #d4a843; --gold-dim: #8b6914; --text: #c8c8c8; --text-dim: #777;
  --red: #e05555; --green: #5cb85c; --blue: #5b9bd5; --cyan: #5bc0c0;
  --purple: #b05bb0; --orange: #e09050;
  --hp: #4caf50; --mp: #2196f3; --food: #ff9800; --water: #03a9f4; --danger: #f44336;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:14px; display:flex; flex-direction:column;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ===== Header (compact: title + room + status) ===== */
#header {
  background:linear-gradient(180deg,#1a1a2e 0%,#151528 100%);
  padding:4px 8px; display:flex; align-items:center; gap:6px;
  border-bottom:1px solid var(--border); flex-shrink:0; z-index:20; flex-wrap:wrap;
}
#header .title { color:var(--gold); font-size:12px; font-weight:700; white-space:nowrap; }
#header-right { display:flex; align-items:center; gap:4px; margin-left:auto; }
#status-dot { width:6px; height:6px; border-radius:50%; display:inline-block; flex-shrink:0; }
#status-dot.on { background:var(--green); box-shadow:0 0 6px var(--green); }
#status-dot.off { background:var(--danger); }
#status-dot.connecting { background:var(--food); animation:blink 1s infinite; }
#status-text { font-size:9px; color:var(--text-dim); }
.header-btn {
  background:var(--panel); color:var(--gold); border:1px solid var(--border);
  border-radius:8px; padding:2px 6px; font-size:9px; cursor:pointer;
}
.header-btn:active { background:#3a3a5e; }
#room-name { color:var(--gold); font-size:10px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; }
#room-exits { display:flex; gap:2px; flex-wrap:wrap; }
.exit-tag { font-size:8px; padding:1px 4px; border-radius:3px; background:#1a2a1a; color:#5cb85c; border:1px solid #2a4a2a; white-space:nowrap; }

/* ===== Compact Status Bar ===== */
#status-bar {
  display:flex; gap:2px; padding:2px 6px; background:#111120;
  border-bottom:1px solid var(--border); flex-shrink:0; overflow-x:auto;
}
#status-bar::-webkit-scrollbar { display:none; }
.stat-item { display:flex; flex-direction:column; align-items:center; min-width:40px; flex-shrink:0; }
.stat-icon { font-size:9px; }
.stat-val { font-size:8px; font-weight:600; }
.stat-bar-wrap { width:100%; height:2px; background:#222; border-radius:1px; margin-top:1px; overflow:hidden; }
.stat-bar-fill { height:100%; border-radius:1px; transition:width 0.3s; }

/* ===== Main Output + Chat Split ===== */
#output-wrap {
  flex:1; min-height:0; display:flex; flex-direction:column;
}
#main-output-area {
  flex:2; min-height:60px; display:flex; flex-direction:column; position:relative;
}
#main-output-label {
  position:absolute; top:0; left:0; right:0; z-index:1;
  font-size:9px; color:var(--text-dim); padding:1px 8px;
  background:linear-gradient(180deg,#0f0f1a 60%,transparent);
  letter-spacing:2px; line-height:1.2; pointer-events:none;
}
#main-output {
  flex:1; min-height:0; overflow-y:auto; padding:6px 8px; white-space:pre-wrap;
  word-break:break-all; line-height:1.5; font-size:12px;
  font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
}
#main-output::-webkit-scrollbar { width:2px; }
#main-output::-webkit-scrollbar-track { background:transparent; }
#main-output::-webkit-scrollbar-thumb { background:#333; border-radius:1px; }

/* Split handle */
#split-handle {
  height:4px; background:var(--border); cursor:row-resize; flex-shrink:0;
  position:relative;
}
#split-handle::after {
  content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:30px; height:3px; background:#555; border-radius:2px;
}
#split-handle:active { background:var(--gold); }

/* Chat panel */
#chat-panel {
  flex:1; min-height:40px; display:flex; flex-direction:column;
  background:#0a0a14; border-top:1px solid var(--border);
}
#chat-panel.collapsed { flex:0; min-height:0; }
#chat-panel.collapsed #chat-header { border-bottom:none; }
#chat-panel.collapsed #chat-output,
#chat-panel.collapsed #chat-quick { display:none; }
#chat-header {
  display:flex; align-items:center; gap:3px; padding:2px 6px;
  background:#111120; flex-shrink:0; border-bottom:1px solid #1a1a2e;
}
#chat-title {
  font-size:9px; color:var(--cyan); font-weight:600; white-space:nowrap; letter-spacing:1px;
}
#chat-toggle {
  background:none; border:none; color:var(--text-dim); font-size:10px;
  cursor:pointer; padding:0 4px; margin-left:auto;
}
#chat-quick {
  display:flex; gap:2px; padding:2px 4px; background:#0d0d18;
  flex-shrink:0; overflow-x:auto; border-bottom:1px solid #1a1a2e;
}
#chat-quick::-webkit-scrollbar { display:none; }
.chat-chn-btn {
  font-size:8px; padding:2px 5px; border-radius:6px; background:#1a1a2e;
  color:var(--text-dim); border:1px solid #2a2a3e; cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.chat-chn-btn:active { background:#3a3a5e; }
.chat-chn-btn.chat { color:var(--cyan); }
.chat-chn-btn.rumor { color:var(--purple); }
.chat-chn-btn.party { color:var(--green); }
#chat-output {
  flex:1; min-height:0; overflow-y:auto; padding:3px 6px; white-space:pre-wrap;
  word-break:break-all; line-height:1.4; font-size:11px;
  font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
}
#chat-output::-webkit-scrollbar { width:2px; }
#chat-output::-webkit-scrollbar-track { background:transparent; }
#chat-output::-webkit-scrollbar-thumb { background:#333; border-radius:1px; }
.chat-line { padding:1px 0; border-bottom:1px solid #0d0d18; }
.chat-line.rumor { color:var(--purple); }
.chat-line.chat { color:var(--cyan); }
.chat-line.party { color:var(--green); }
.chat-line.trade { color:var(--gold); }
.chat-line.say { color:#aaa; }
.chat-line.tell { color:var(--orange); }
.chat-line.system { color:var(--text-dim); font-style:italic; }

/* ANSI */
.ansi-0 {} .ansi-1 { font-weight:bold; } .ansi-2 { opacity:0.5; }
.ansi-3 { font-style:italic; } .ansi-4 { text-decoration:underline; }
.ansi-5 { animation:blink 1s step-end infinite; } .ansi-7 { filter:invert(1); }
.ansi-30 { color:#000; } .ansi-31 { color:#e05555; } .ansi-32 { color:#5cb85c; }
.ansi-33 { color:#d4a843; } .ansi-34 { color:#5b9bd5; } .ansi-35 { color:#b05bb0; }
.ansi-36 { color:#5bc0c0; } .ansi-37 { color:#ddd; }
.ansi-40 { background:#000; } .ansi-41 { background:#c0392b; }
.ansi-42 { background:#27ae60; } .ansi-43 { background:#d4a843; }
.ansi-44 { background:#2980b9; } .ansi-45 { background:#8e44ad; }
.ansi-46 { background:#16a085; } .ansi-47 { background:#bbb; }
.ansi-90 { color:#777; } .ansi-91 { color:#ff6b6b; } .ansi-92 { color:#6bff6b; }
.ansi-93 { color:#ffe66b; } .ansi-94 { color:#6b9bff; } .ansi-95 { color:#e06bff; }
.ansi-96 { color:#6bffff; } .ansi-97 { color:#fff; }
@keyframes blink { 50% { opacity:0; } }

/* ===== NPC Bar (thin) ===== */
#npc-bar {
  display:flex; gap:3px; padding:2px 6px; background:#111120;
  border-top:1px solid var(--border); flex-shrink:0; overflow-x:auto; min-height:0;
}
#npc-bar:empty { padding:0; border-top:none; }
#npc-bar::-webkit-scrollbar { display:none; }
.npc-btn {
  font-size:8px; padding:2px 5px; border-radius:4px; background:#1a1a2a;
  color:var(--cyan); border:1px solid #2a3a4a; white-space:nowrap; cursor:pointer; flex-shrink:0;
}
.npc-btn:active { background:#2a3a5a; }

/* ===== Unified Bottom Bar ===== */
#bottom-bar {
  display:flex; gap:3px; padding:4px 6px; padding-bottom:calc(4px + var(--safe-bottom));
  background:#1a1a2e; border-top:1px solid var(--border); flex-shrink:0; align-items:center;
}
#cmd-input {
  flex:1; background:#0d0d18; border:1px solid #2a2a3e; border-radius:12px;
  color:#e0e0e0; font-family:inherit; font-size:12px; padding:6px 10px; outline:none; caret-color:var(--gold);
  min-width:0;
}
#cmd-input:focus { border-color:var(--gold); }
#send-btn {
  background:var(--gold); color:#1a1a2e; border:none; border-radius:12px;
  padding:6px 10px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; flex-shrink:0;
}
#send-btn:active { opacity:0.8; }
#dir-toggle {
  background:var(--panel); color:var(--text); border:1px solid var(--border);
  border-radius:12px; padding:6px 8px; font-size:12px; cursor:pointer; flex-shrink:0;
  transition:all 0.15s;
}
#dir-toggle:active { background:#3a3a5e; }
#dir-toggle.active { background:#1a2a1a; border-color:#2a4a2a; color:var(--green); }
#tab-toggle {
  background:var(--panel); color:var(--gold); border:1px solid var(--border);
  border-radius:12px; padding:6px 8px; font-size:12px; cursor:pointer; flex-shrink:0;
}
#tab-toggle:active { background:#3a3a5e; }

/* ===== Floating Direction Pad ===== */
#dir-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:30;
}
#dir-overlay.show { display:flex; align-items:flex-end; justify-content:center; }
#dir-pad {
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  gap:3px; padding:8px; background:#1a1a2e; border-radius:16px 16px 0 0;
  width:100%; max-width:240px; margin-bottom:80px;
}
.dir-btn {
  aspect-ratio:1; border-radius:8px; background:#1a1a2e; color:var(--text);
  border:1px solid #2a2a3e; font-size:12px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:all 0.1s; padding:2px; gap:1px; min-height:0; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.dir-btn:active { background:#3a3a5e; transform:scale(0.9); }
.dir-btn.available { background:#1a2a1a; border-color:#2a4a2a; color:var(--green); }
.dir-btn .dir-arrow { font-size:16px; line-height:1; }
.dir-btn .dir-label { font-size:8px; line-height:1; opacity:0.7; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dir-btn.center { background:#1a1a3a; border-color:var(--gold); color:var(--gold); cursor:default; }
.dir-btn.center .dir-arrow { font-size:9px; }
.dir-btn.center .dir-label { font-size:8px; color:var(--gold); }

/* ===== Floating Tab Bar ===== */
#tab-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:30;
}
#tab-overlay.show { display:flex; align-items:flex-end; }
#tab-sheet {
  width:100%; background:#1a1a2e; border-radius:16px 16px 0 0; padding:12px;
  max-height:70vh; overflow-y:auto;
}
#tab-sheet h3 { color:var(--gold); margin-bottom:8px; font-size:14px; text-align:center; }
#tab-sheet .tab-row { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; }
.tab-act-btn {
  display:inline-block; padding:6px 10px; border-radius:10px; background:#1a1a2e;
  color:var(--text); border:1px solid #2a2a3e; font-size:10px; cursor:pointer; white-space:nowrap;
}
.tab-act-btn:active { background:#3a3a5e; }
.tab-act-btn.primary { background:#2a2a1a; border-color:#4a4a2a; color:var(--gold); }

/* ===== Toast ===== */
#toast {
  position:fixed; bottom:120px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.85); color:#fff; padding:6px 14px; border-radius:12px;
  font-size:11px; z-index:200; opacity:0; transition:opacity 0.3s; pointer-events:none;
}
#toast.show { opacity:1; }

/* ===== Panel Overlay (universal) ===== */
#panel-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50;
}
#panel-overlay.show { display:block; }
#panel-sheet {
  position:fixed; bottom:0; left:0; right:0; background:#1a1a2e;
  border-radius:16px 16px 0 0; z-index:51; max-height:80vh; overflow-y:auto;
  padding:16px; transform:translateY(100%); transition:transform 0.3s;
}
#panel-sheet.show { transform:translateY(0); }
#panel-sheet h3 { color:var(--gold); margin-bottom:8px; font-size:14px; }
#panel-sheet h4 { color:var(--cyan); font-size:11px; margin:10px 0 4px; border-top:1px solid #222; padding-top:8px; }
.panel-row { display:flex; justify-content:space-between; padding:3px 0; font-size:11px; border-bottom:1px solid #1a1a2a; }
.panel-row .lbl { color:var(--text-dim); }
.panel-row .val { color:var(--text); font-weight:600; }
.panel-bar-wrap { height:6px; background:#222; border-radius:3px; margin:4px 0 8px; overflow:hidden; }
.panel-bar-fill { height:100%; border-radius:3px; transition:width 0.3s; }
.panel-btn {
  display:inline-block; margin:3px; padding:5px 10px; border-radius:10px;
  background:#1a1a2e; color:var(--text); border:1px solid #2a2a3e; font-size:10px; cursor:pointer;
}
.panel-btn:active { background:#3a3a5e; }
.panel-btn.primary { background:#2a2a1a; border-color:#4a4a2a; color:var(--gold); }
.panel-btn.danger { background:#2a1a1a; border-color:#4a2a2a; color:var(--red); }
.panel-btn.skill { color:var(--gold); }
.panel-btn.combat { color:var(--red); }
.panel-btn.cmd { color:var(--blue); }
.panel-btn.wide { display:block; width:100%; text-align:left; padding:8px 10px; border-radius:6px; margin:2px 0; border-bottom:1px solid #222; }
.panel-btn.wide:active { background:#2a2a4e; }
.panel-close {
  display:block; width:100%; text-align:center; padding:10px; background:transparent;
  border:none; color:#888; font-size:12px; cursor:pointer; margin-top:6px;
}
.panel-close:active { background:#222; }
.panel-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.panel-grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; }
.panel-grid4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:4px; }

/* Touch */
#bottom-bar,#dir-pad,#dir-overlay,#tab-overlay,#npc-bar,#status-bar { touch-action:manipulation; }
</style>
</head>
<body>

<div id="header">
  <span class="title">书剑 v3</span>
  <span id="build-ver" style="font-size:9px;color:#555;margin-left:4px;"></span>
  <span id="room-name">--</span>
  <span id="room-exits"></span>
  <div id="header-right">
    <span><span id="status-dot" class="connecting"></span><span id="status-text">连接中</span></span>
    <button class="header-btn" id="btn-reconnect" style="display:none" onclick="MUD.reconnect()">重连</button>
  </div>
</div>

<div id="status-bar">
  <div class="stat-item"><span class="stat-icon">❤</span><span class="stat-val" style="color:var(--hp)" id="s-hp">--</span><div class="stat-bar-wrap"><div class="stat-bar-fill" style="width:0;background:var(--hp)" id="b-hp"></div></div></div>
  <div class="stat-item"><span class="stat-icon">💙</span><span class="stat-val" style="color:var(--mp)" id="s-mp">--</span><div class="stat-bar-wrap"><div class="stat-bar-fill" style="width:0;background:var(--mp)" id="b-mp"></div></div></div>
  <div class="stat-item"><span class="stat-icon">⚡</span><span class="stat-val" style="color:var(--blue)" id="s-ep">--</span><div class="stat-bar-wrap"><div class="stat-bar-fill" style="width:0;background:var(--blue)" id="b-ep"></div></div></div>
  <div class="stat-item"><span class="stat-icon">🍖</span><span class="stat-val" style="color:var(--food)" id="s-food">--</span></div>
  <div class="stat-item"><span class="stat-icon">💧</span><span class="stat-val" style="color:var(--water)" id="s-water">--</span></div>
  <div class="stat-item"><span class="stat-icon">✨</span><span class="stat-val" style="color:var(--gold)" id="s-exp">--</span></div>
</div>

<div id="output-wrap">
  <div id="chat-panel">
    <div id="chat-header">
      <span id="chat-title">聊天</span>
      <button id="chat-toggle" title="折叠">▼</button>
    </div>
    <div id="chat-quick">
      <button class="chat-chn-btn chat" data-chn="chat">闲聊</button>
      <button class="chat-chn-btn rumor" data-chn="rumor">谣言</button>
      <button class="chat-chn-btn party" data-chn="party">门派</button>
      <button class="chat-chn-btn" data-chn="say">说话</button>
      <button class="chat-chn-btn" data-chn="tell">私聊</button>
      <button class="chat-chn-btn" data-chn="sj">书剑</button>
      <button class="chat-chn-btn" data-chn="trade">交易</button>
    </div>
    <div id="chat-output"></div>
  </div>
  <div id="split-handle"></div>
  <div id="main-output-area">
    <div id="main-output-label">主屏</div>
    <div id="main-output"></div>
  </div>
</div>

<div id="npc-bar"></div>

<div id="bottom-bar">
  <input type="text" id="cmd-input" placeholder="输入指令..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <button id="send-btn">发送</button>
  <button id="dir-toggle" title="方向">🧭</button>
  <button id="tab-toggle" title="功能">☰</button>
</div>

<!-- 浮动方向盘 -->
<div id="dir-overlay">
  <div id="dir-pad">
    <button class="dir-btn" data-slot="nw">↖<span class="dir-label"></span></button>
    <button class="dir-btn" data-slot="n">↑<span class="dir-label"></span></button>
    <button class="dir-btn" data-slot="ne">↗<span class="dir-label"></span></button>
    <button class="dir-btn" data-slot="w">←<span class="dir-label"></span></button>
    <button class="dir-btn center" data-slot="c"><span class="dir-arrow">📍</span><span class="dir-label">--</span></button>
    <button class="dir-btn" data-slot="e">→<span class="dir-label"></span></button>
    <button class="dir-btn" data-slot="sw">↙<span class="dir-label"></span></button>
    <button class="dir-btn" data-slot="s">↓<span class="dir-label"></span></button>
    <button class="dir-btn" data-slot="se">↘<span class="dir-label"></span></button>
  </div>
</div>

<!-- Tab选择面板 -->
<div id="tab-overlay">
  <div id="tab-sheet"></div>
</div>

<div id="toast"></div>

<!-- Universal Panel -->
<div id="panel-overlay"><div id="panel-sheet"></div></div>

<script>
(function() {
  'use strict';

  // ===== MUD Global Object =====
  window.MUD = {
    // State
    sid: null, connecting: false, connected: false, pollTimer: null,
    reconnectTimer: null, reconnectDelay: 5000, reconnectRetries: 0, maxReconnect: 20,
    currentRoom: '', currentExits: {}, currentNPCs: [], playerStats: {},
    inputHistory: [], historyIdx: -1, currentInput: '', activeTab: 'actions',
    roomNameCache: {}, pendingLookDirs: [], lookDirIdx: 0, inLookMode: false,

    // Init
    init: function() {
      this.bindEvents();
      this.connectWS();
    },

    $: function(id) { return document.getElementById(id); },

    // ===== Helpers =====
    escHtml: function(s) {
      if (typeof s !== 'string') return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    },
    stripAnsi: function(s) { return s.replace(/\x1b\[[0-9;]*m/g,''); },

    parseAnsi: function(text) {
      var re = /\x1b\[([0-9;]*)m/g, result = '', last = 0, m, open = [];
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) result += this.escHtml(text.substring(last, m.index));
        var codes = (m[1] === '' || m[1] === '0') ? [0] : m[1].split(';').map(function(c){return parseInt(c,10)||0;});
        var cls = [];
        for (var i = 0; i < codes.length; i++) {
          var c = codes[i];
          if (c === 0) cls = [];
          else if (c === 1) cls.push('ansi-1'); else if (c === 2) cls.push('ansi-2');
          else if (c === 3) cls.push('ansi-3'); else if (c === 4) cls.push('ansi-4');
          else if (c === 5) cls.push('ansi-5'); else if (c === 7) cls.push('ansi-7');
          else if (c >= 30 && c <= 37) cls.push('ansi-'+c);
          else if (c >= 40 && c <= 47) cls.push('ansi-'+c);
          else if (c >= 90 && c <= 97) cls.push('ansi-'+c);
          else if (c >= 100 && c <= 107) cls.push('ansi-'+c);
        }
        for (var j = 0; j < open.length; j++) result += '</span>';
        open = [];
        if (cls.length > 0) { result += '<span class="'+cls.join(' ')+'">'; open = cls; }
        last = m.index + m[0].length;
      }
      if (last < text.length) result += this.escHtml(text.substring(last));
      for (var k = 0; k < open.length; k++) result += '</span>';
      return result;
    },

    // ===== Game Output Parser =====
    parseGameOutput: function(text) {
      var self = this, clean = this.stripAnsi(text);

      if (this.inLookMode) {
        var lookRoomMatch = clean.match(/^(\S{1,12})\s*-\s*(\/.*)?$/m);
        if (lookRoomMatch && this.lookDirIdx < this.pendingLookDirs.length) {
          var dir = this.pendingLookDirs[this.lookDirIdx], rname = lookRoomMatch[1];
          if (rname.length >= 2 && !/^[a-zA-Z0-9_]+$/.test(rname)) this.roomNameCache[dir] = rname;
          this.lookDirIdx++;
          if (this.lookDirIdx < this.pendingLookDirs.length) {
            setTimeout(function(){ self.sendCommand('look ' + self.pendingLookDirs[self.lookDirIdx]); }, 80);
          } else { this.inLookMode = false; this.updateDirPad(); }
        }
        if (this.inLookMode) return;
      }

      var roomMatch = clean.match(/^(\S+)\s*-\s*$/m);
      if (roomMatch && roomMatch[1].length >= 2 && roomMatch[1].length <= 20) {
        this.currentRoom = roomMatch[1];
        this.$('room-name').textContent = '📍 ' + this.currentRoom;
        this.updateDirPad();
      }

      var exitMatch = clean.match(/这里明显的出口是\s*([^。]+)/);
      if (exitMatch) {
        var exits = {};
        exitMatch[1].split(/[、，,和\s]+/).filter(Boolean).forEach(function(d){
          d = d.trim().toLowerCase(); exits[d] = d;
        });
        this.currentExits = exits;
        this.updateDirPad();
        this.updateExitTags();
        this.lookExits();
      }

      var npcRegex = /([^\s\x1b\[\]\(\)\-\d\*\|]{2,4})\(([A-Za-z][a-z\s]+)\)/g;
      var npcs = [], npcm;
      while ((npcm = npcRegex.exec(clean)) !== null) {
        var nm = npcm[1].trim(), nid = npcm[2].trim();
        if (nm.length >= 2 && nm.length <= 4 && nid.length >= 2 &&
            !/花名册|留言|Board|出口|明显|权限|贵宾|系统|提示|消息|状态|短消息|玩家|武士/i.test(nm)) {
          if (!npcs.find(function(n){return n.id===nid;})) npcs.push({ name: nm, id: nid });
        }
      }
      if (npcs.length > 0) { this.currentNPCs = npcs; this.updateNPCBar(); }

      var hpM = clean.match(/·气血·\s*(\d+)\s*\/\s*(\d+)/);
      if (hpM) {
        this.playerStats.hp = hpM[1]; this.playerStats.maxHp = hpM[2];
        this.$('s-hp').textContent = hpM[1]+'/'+hpM[2];
        this.$('b-hp').style.width = (parseInt(hpM[1])/parseInt(hpM[2])*100)+'%';
      }
      var mpM = clean.match(/·内力·\s*(\d+)\s*\/\s*(\d+)/);
      if (mpM) {
        this.playerStats.mp = mpM[1]; this.playerStats.maxMp = mpM[2];
        this.$('s-mp').textContent = mpM[1]+'/'+mpM[2];
        this.$('b-mp').style.width = (parseInt(mpM[2])>0?parseInt(mpM[1])/parseInt(mpM[2])*100:0)+'%';
      }
      var epM = clean.match(/·精力·\s*(\d+)\s*\/\s*(\d+)/);
      if (epM) {
        this.playerStats.ep = epM[1]; this.playerStats.maxEp = epM[2];
        this.$('s-ep').textContent = epM[1]+'/'+epM[2];
        this.$('b-ep').style.width = (parseInt(epM[1])/parseInt(epM[2])*100)+'%';
      }
      var foodM = clean.match(/·食物·\s*([\d.]+)%/);
      if (foodM) { this.playerStats.food = foodM[1]; this.$('s-food').textContent = foodM[1]+'%'; }
      var waterM = clean.match(/·饮水·\s*([\d.]+)%/);
      if (waterM) { this.playerStats.water = waterM[1]; this.$('s-water').textContent = waterM[1]+'%'; }
      var expM = clean.match(/·经验·\s*(\d+)/);
      if (expM) { this.playerStats.exp = expM[1]; this.$('s-exp').textContent = expM[1]; }
      var potM = clean.match(/·潜能·\s*(\d+)/);
      if (potM) this.playerStats.pot = potM[1];
      var jxM = clean.match(/·精血·\s*(\d+)\s*\/\s*(\d+)/);
      if (jxM) { this.playerStats.jx = jxM[1]; this.playerStats.maxJx = jxM[2]; }
      var zqM = clean.match(/·正气·\s*(\-?\d+)/);
      if (zqM) this.playerStats.zq = zqM[1];
      var nlMaxM = clean.match(/·内力上限·\s*(\d+)\s*\/\s*(\d+)/);
      if (nlMaxM) this.playerStats.nlMax = nlMaxM[1]+'/'+nlMaxM[2];
      var jlM = clean.match(/·精·\s*(\d+)\s*\/\s*(\d+)/);
      if (jlM && !jxM) { this.playerStats.jl = jlM[1]; this.playerStats.maxJl = jlM[2]; }
      var qiM = clean.match(/·气·\s*(\d+)\s*\/\s*(\d+)/);
      if (qiM && !this.playerStats.mp) { this.playerStats.qi = qiM[1]; this.playerStats.maxQi = qiM[2]; }
    },

    // ===== Direction System =====
    slotMap: {
      'nw': ['northwest'], 'n': ['north','northup','northdown'], 'ne': ['northeast'],
      'w': ['west','westup','westdown'], 'e': ['east','eastup','eastdown'],
      'sw': ['southwest'], 's': ['south','southup','southdown'], 'se': ['southeast']
    },

    lookExits: function() {
      this.roomNameCache = {};
      var dirs = Object.keys(this.currentExits);
      if (dirs.length === 0) return;
      this.pendingLookDirs = dirs; this.lookDirIdx = 0; this.inLookMode = true;
      this.sendCommand('look ' + this.pendingLookDirs[0]);
    },

    updateDirPad: function() {
      var self = this;
      var centerBtn = document.querySelector('#dir-pad .dir-btn[data-slot="c"]');
      if (centerBtn) centerBtn.querySelector('.dir-label').textContent = self.currentRoom || '--';

      document.querySelectorAll('#dir-pad .dir-btn[data-slot]').forEach(function(btn){
        var slot = btn.dataset.slot;
        if (slot === 'c') return;
        var possibilities = self.slotMap[slot] || [];
        var found = null;
        for (var i = 0; i < possibilities.length; i++) {
          if (self.currentExits[possibilities[i]]) { found = possibilities[i]; break; }
        }
        if (!found && slot === 'n' && self.currentExits['enter']) found = 'enter';
        if (!found && slot === 'n' && self.currentExits['up']) found = 'up';
        if (!found && slot === 's' && self.currentExits['down']) found = 'down';
        if (!found && slot === 's' && self.currentExits['out']) found = 'out';

        if (found) {
          btn.classList.add('available'); btn.dataset.cmd = found;
          var label = self.roomNameCache[found] || found;
          if (found === 'northup') label = '北↑';
          else if (found === 'southdown') label = '南↓';
          else if (found === 'northdown') label = '北↓';
          else if (found === 'southup') label = '南↑';
          else if (found === 'eastup') label = '东↑';
          else if (found === 'westup') label = '西↑';
          else if (found === 'enter') label = '入';
          else if (found === 'out') label = '出';
          btn.querySelector('.dir-label').textContent = label;
        } else {
          btn.classList.remove('available'); btn.dataset.cmd = '';
          btn.querySelector('.dir-label').textContent = '';
        }
      });
    },

    updateExitTags: function() {
      var labels = {'east':'东','west':'西','south':'南','north':'北','northup':'北↑','southdown':'南↓','northdown':'北↓','southup':'南↑','eastup':'东↑','westup':'西↑','eastdown':'东↓','westdown':'西↓','northeast':'东北','northwest':'西北','southeast':'东南','southwest':'西南','up':'上','down':'下','enter':'入','out':'出'};
      var html = '';
      Object.keys(this.currentExits).forEach(function(d){ html += '<span class="exit-tag">'+(labels[d]||d)+'</span>'; });
      this.$('room-exits').innerHTML = html;
    },

    updateNPCBar: function() {
      var self = this;
      var html = '';
      this.currentNPCs.forEach(function(npc){
        html += '<button class="npc-btn" data-npc="'+self.escHtml(npc.id)+'" data-name="'+self.escHtml(npc.name)+'">'+self.escHtml(npc.name)+'</button>';

    },

    // ===== HTTP Long-Polling Transport =====
    setStatus: function(state, text) {
      this.$('status-dot').className = state;
      this.$('status-text').textContent = text;
      if (state === 'on') { this.connected = true; this.$('btn-reconnect').style.display = 'none'; }
      else if (state === 'off') { this.connected = false; this.$('btn-reconnect').style.display = 'inline-block'; }
    },

    stopPolling: function() {
      if (this.pollTimer) { clearTimeout(this.pollTimer); this.pollTimer = null; }
    },

    connectWS: function() {
      var self = this;
      // Prevent concurrent connect calls
      if (self.connecting) return;
      self.connecting = true;
      self.stopPolling();
      self.setStatus('connecting', '连接中...');

      fetch('/connect', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          self.sid = data.sid;
          self.setStatus('on', '已连接');
          self.reconnectDelay = 5000;
          self.reconnectRetries = 0;
          self.connecting = false;
          self.startPolling();
        })
        .catch(function(err) {
          console.log('Connect error:', err);
          self.connecting = false;
          self.setStatus('off', '连接失败');
          self.scheduleReconnect();
        });
    },

    startPolling: function() {
      var self = this;
      if (!self.sid) return;
      self.stopPolling();

      var doPoll = function() {
        if (!self.sid || self.connecting) return;
        fetch('/poll?sid=' + encodeURIComponent(self.sid))
          .then(function(r) { return r.text(); })
          .then(function(text) {
            if (!self.sid) return; // session was replaced
            if (text === '__CLOSED__') {
              self.sid = null;
              self.stopPolling();
              self.setStatus('off', '会话关闭');
              self.scheduleReconnect();
              return;
            }
            if (text) {
              self.appendOutput(text);
            }
            if (self.sid) {
              self.pollTimer = setTimeout(doPoll, 200);
            }
          })
          .catch(function(err) {
            console.log('Poll error:', err);
            if (self.sid && !self.connecting) {
              self.pollTimer = setTimeout(doPoll, 2000);
            }
          });
      };
      doPoll();
    },

    scheduleReconnect: function() {
      var self = this;
      if (self.connecting) return; // already connecting
      if (self.reconnectTimer) return;
      if (self.reconnectRetries >= self.maxReconnect) {
        self.setStatus('off', '重连失败');
        self.showToast('重连次数过多，请手动刷新页面');
        return;
      }
      self.reconnectRetries++;
      self.setStatus('connecting', '重连中...');
      self.reconnectTimer = setTimeout(function() {
        self.reconnectTimer = null;
        self.connectWS();
      }, self.reconnectDelay);
      self.reconnectDelay = Math.min(self.reconnectDelay * 2, 30000);
    },

    reconnect: function() {
      this.reconnectDelay = 15000; this.reconnectRetries = 0;
      if (this.reconnectTimer) { clearTimeout(this.reconnectTimer); this.reconnectTimer = null; }
      this.sid = null; this.connecting = false;
      this.stopPolling();
      this.connectWS();
    },

    sendCommand: function(cmd) {
      if (!cmd) return;
      if (cmd.length > 500) { this.showToast('指令过长'); return; }
      if (!this.sid) { this.showToast('未连接，正在重连...'); this.reconnect(); return; }
      var self = this;
      fetch('/cmd', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sid: self.sid, cmd: cmd })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.ok) self.showToast('发送失败: ' + (data.err || ''));
      })
      .catch(function(err) {
        self.showToast('发送失败');
      });
    },

    // Chat detection patterns
    chatPatterns: [
      { regex: /【(闲聊|聊天|谣言|门派|交易|书剑|帮派|聊天室|信息|系统|通告|调试|错误|龙神|顾问|巫师|仙人|神官|天神)】/, type: 'channel' },
      { regex: /(说道|有气无力地说道|回答你|告诉你|对你说道)/, type: 'say' },
      { regex: /【(闲聊|聊天)】/, type: 'chat' },
      { regex: /【谣言】/, type: 'rumor' },
      { regex: /【门派】/, type: 'party' },
      { regex: /【交易】/, type: 'trade' },
      { regex: /【系统】|【通告】/, type: 'system' },
    ],

    isChatMessage: function(text) {
      for (var i = 0; i < this.chatPatterns.length; i++) {
        if (this.chatPatterns[i].regex.test(text)) return this.chatPatterns[i].type;
      }
      return null;
    },

    appendOutput: function(text) {
      if (!text) return;
      var div = document.createElement('div');
      div.innerHTML = this.parseAnsi(text);
      var mainOut = this.$('main-output');
      mainOut.appendChild(div);
      while (mainOut.children.length > 1500) mainOut.removeChild(mainOut.firstChild);
      mainOut.scrollTop = mainOut.scrollHeight;

      // Route chat messages to chat panel
      var chatType = this.isChatMessage(this.stripAnsi(text));
      if (chatType) {
        var cdiv = document.createElement('div');
        cdiv.className = 'chat-line ' + chatType;
        cdiv.innerHTML = this.parseAnsi(text);
        var chatOut = this.$('chat-output');
        chatOut.appendChild(cdiv);
        while (chatOut.children.length > 500) chatOut.removeChild(chatOut.firstChild);
        chatOut.scrollTop = chatOut.scrollHeight;
      }

      this.parseGameOutput(text);
    },

    clearOutput: function() {
      this.$('main-output').innerHTML = '';
      this.$('chat-output').innerHTML = '';
      this.currentExits = {}; this.currentNPCs = []; this.currentRoom = '';
      this.roomNameCache = {}; this.inLookMode = false; this.playerStats = {};
      this.$('room-name').textContent = '--'; this.$('room-exits').innerHTML = '';
      this.$('npc-bar').innerHTML = ''; this.updateDirPad();
    },

    showToast: function(msg) {
      var self = this;
      self.$('toast').textContent = msg;
      self.$('toast').classList.add('show');
      clearTimeout(self._toastTimer);
      self._toastTimer = setTimeout(function(){ self.$('toast').classList.remove('show'); }, 2000);
    },

    // ===== Event Binding =====
    bindEvents: function() {
      var self = this;

      // Tab toggle → show bottom sheet with 7 modules
      self.$('tab-toggle').addEventListener('click', function(){
        self.showTabSheet();
      });

      // Tab sheet close on backdrop
      self.$('tab-overlay').addEventListener('click', function(e){
        if (e.target === self.$('tab-overlay')) self.closeTabSheet();
      });

      // Dir toggle → show floating direction pad
      self.$('dir-toggle').addEventListener('click', function(){
        self.$('dir-overlay').classList.toggle('show');
        self.$('dir-toggle').classList.toggle('active');
      });

      // Dir overlay close on backdrop
      self.$('dir-overlay').addEventListener('click', function(e){
        if (e.target === self.$('dir-overlay')) {
          self.$('dir-overlay').classList.remove('show');
          self.$('dir-toggle').classList.remove('active');
        }
      });

      // Panel overlay close
      self.$('panel-overlay').addEventListener('click', function(e){
        if (e.target === self.$('panel-overlay')) self.closePanel();
      });

      // Direction pad (inside floating overlay)
      document.querySelectorAll('#dir-pad .dir-btn[data-slot]').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (btn.dataset.cmd) {
            self.sendCommand(btn.dataset.cmd);
            self.$('dir-overlay').classList.remove('show');
            self.$('dir-toggle').classList.remove('active');
          }
        });
      });

      // Input
      self.$('cmd-input').addEventListener('keydown', function(e){
        if (e.key === 'Enter') {
          e.preventDefault();
          var cmd = self.$('cmd-input').value.trim();
          if (cmd) {
            self.sendCommand(cmd);
            if (cmd !== self.inputHistory[self.inputHistory.length-1]) {
              self.inputHistory.push(cmd);
              if (self.inputHistory.length > 200) self.inputHistory.shift();
            }
            self.historyIdx = self.inputHistory.length;
            self.$('cmd-input').value = '';
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (self.inputHistory.length === 0) return;
          if (self.historyIdx === self.inputHistory.length) self.currentInput = self.$('cmd-input').value;
          self.historyIdx = Math.max(0, self.historyIdx - 1);
          self.$('cmd-input').value = self.inputHistory[self.historyIdx];
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (self.historyIdx < self.inputHistory.length - 1) { self.historyIdx++; self.$('cmd-input').value = self.inputHistory[self.historyIdx]; }
          else { self.historyIdx = self.inputHistory.length; self.$('cmd-input').value = self.currentInput; }
        }
      });

      self.$('send-btn').addEventListener('click', function(){
        var cmd = self.$('cmd-input').value.trim();
        if (cmd) {
          self.sendCommand(cmd);
          if (cmd !== self.inputHistory[self.inputHistory.length-1]) {
            self.inputHistory.push(cmd);
            if (self.inputHistory.length > 200) self.inputHistory.shift();
          }
          self.historyIdx = self.inputHistory.length;
          self.$('cmd-input').value = '';
        }
      });

      // Click main output to focus input
      self.$('main-output').addEventListener('click', function(){ self.$('cmd-input').focus(); });

      // Chat panel toggle
      self.$('chat-toggle').addEventListener('click', function(){
        var panel = self.$('chat-panel');
        panel.classList.toggle('collapsed');
        self.$('chat-toggle').textContent = panel.classList.contains('collapsed') ? '▶' : '▼';
      });

      // Chat channel quick buttons
      self.$('chat-quick').querySelectorAll('.chat-chn-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var chn = btn.dataset.chn;
          self.$('cmd-input').focus();
          if (chn === 'say') { self.$('cmd-input').value = 'say '; }
          else if (chn === 'tell') { self.$('cmd-input').value = 'tell '; }
          else { self.$('cmd-input').value = chn + ' '; }
        });
      });

      // Split handle drag
      var splitHandle = self.$('split-handle');
      var mainArea = self.$('main-output-area');
      var chatPanel = self.$('chat-panel');
      var startY, startMainFlex, startChatFlex;
      splitHandle.addEventListener('touchstart', function(e){
        startY = e.touches[0].clientY;
        startMainFlex = parseFloat(mainArea.style.flex) || 2;
        startChatFlex = parseFloat(chatPanel.style.flex) || 1;
      });
      splitHandle.addEventListener('touchmove', function(e){
        var dy = e.touches[0].clientY - startY;
        var wrapH = self.$('output-wrap').clientHeight;
        var newMainFlex = Math.max(1, Math.min(3, startMainFlex + dy / wrapH * 3));
        var newChatFlex = 3 - newMainFlex;
        mainArea.style.flex = newMainFlex;
        chatPanel.style.flex = newChatFlex;
      });
    }
  };

  // Init
  MUD.init();
})();
</script>
</body>
</html>
