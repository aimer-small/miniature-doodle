<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书剑 MUD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#c0c0c0;font-family:'Courier New',monospace;font-size:15px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#header{background:#1a1a2e;padding:8px 16px;border-bottom:2px solid #333;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#header h1{color:#ffd700;font-size:18px}
#status{color:#888;font-size:13px}
#status.on{color:#0f0}
#output{flex:1;overflow-y:auto;padding:12px 16px;white-space:pre-wrap;word-break:break-all;background:#0d0d0d;line-height:1.5}
#input-line{display:flex;flex-shrink:0;border-top:1px solid #333;background:#1a1a2e}
#input-line span{color:#ffd700;padding:10px 0 10px 16px}
#cmd{flex:1;background:transparent;border:none;color:#fff;font-family:'Courier New',monospace;font-size:15px;padding:10px;outline:none}
#quick-login{padding:10px 16px;background:#111;border-top:1px solid #333;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;align-items:center}
#quick-login button{background:#2a2a4a;color:#ffd700;border:1px solid #555;padding:6px 14px;cursor:pointer;font-family:'Courier New',monospace;font-size:13px;border-radius:3px}
#quick-login button:hover{background:#3a3a6a}
.info{color:#888;font-size:12px}
</style>
</head>
<body>
<div id="header"><h1>书剑 MUD · 新纪元</h1><span id="status">连接中...</span></div>
<div id="output"></div>
<div id="quick-login">
  <span class="info">测试账号: mudren / Mr12345</span>
  <button id="btnLogin">一键登录</button>
  <button id="btnDisc">断开</button>
</div>
<div id="input-line"><span>&gt;</span><input id="cmd" type="text" autofocus autocomplete="off" placeholder="输入命令..."></div>

<script>
var out = document.getElementById('output');
var inp = document.getElementById('cmd');
var st = document.getElementById('status');
var sid = null;
var pollTimer = null;
var pollActive = false;
var hist = [];
var hi = -1;

function ap(t) {
  t = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t = t.replace(/\x1b\[1;3(\d)m/g,'<span style="color:#f'+(4+parseInt('$1'))*2+';font-weight:bold">');
  t = t.replace(/\x1b\[3(\d)m/g,'<span style="color:#f'+(4+parseInt('$1'))*2+'">');
  t = t.replace(/\x1b\[0m/g,'</span>').replace(/\x1b\[2;37;0m/g,'</span>');
  t = t.replace(/\x1b\[[0-9;]*[A-Za-z]/g,'');
  out.innerHTML += t;
  out.scrollTop = out.scrollHeight;
}

function snd(t) {
  if (!sid) return;
  fetch('/cmd', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sid: sid, cmd: t })
  }).catch(function(){});
}

function doPoll() {
  if (!sid || pollActive) return;
  pollActive = true;
  fetch('/poll?sid=' + sid)
    .then(function(r) {
      if (!r.ok) throw new Error('poll error');
      return r.text();
    })
    .then(function(t) {
      pollActive = false;
      if (t === '__CLOSED__' || t === '__ERROR__') {
        sid = null;
        st.textContent = '已断开';
        st.className = '';
        ap('\n-- 连接已断开 --\n');
        return;
      }
      if (t) ap(t);
      doPoll();
    })
    .catch(function() {
      pollActive = false;
      setTimeout(doPoll, 2000);
    });
}

function conn() {
  st.textContent = '连接中...';
  fetch('/connect')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      sid = d.sid;
      st.textContent = '已连接';
      st.className = 'on';
      ap('-- 已连接到书剑 MUD 服务器 --\n');
      doPoll();
    })
    .catch(function() {
      st.textContent = '连接失败';
      ap('-- 连接失败，请刷新重试 --\n');
    });
}

document.getElementById('btnLogin').onclick = function() {
  snd('mudren');
  setTimeout(function(){ snd('Mr12345'); }, 800);
};

document.getElementById('btnDisc').onclick = function() {
  if (sid) {
    sid = null;
    st.textContent = '已断开';
    st.className = '';
    ap('\n-- 连接已断开 --\n');
  }
};

inp.onkeydown = function(e) {
  if (e.key === 'Enter') {
    var t = inp.value;
    inp.value = '';
    if (t.trim()) {
      snd(t);
      ap('&gt; ' + t + '\n');
      hist.push(t.trim());
      hi = -1;
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (hi < hist.length - 1) { hi++; inp.value = hist[hist.length - 1 - hi] || ''; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (hi > 0) { hi--; inp.value = hist[hist.length - 1 - hi] || ''; }
    else { hi = -1; inp.value = ''; }
  }
};

conn();
</script>
</body>
</html>
